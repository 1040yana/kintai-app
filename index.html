<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#146c5b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="らくらく勤怠" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>らくらく勤怠</title>
  <style>
    :root { --green:#146c5b; --deep:#0d4037; --cream:#f7f8f4; --line:#dce4df; --ink:#19231f; --muted:#69756f; --orange:#eb8d35; }
    * { box-sizing:border-box; } body { margin:0; background:var(--cream); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
    button,input,select { font:inherit; } button { cursor:pointer; border:0; }
    .shell { max-width:560px; min-height:100vh; margin:auto; background:#fff; box-shadow:0 0 40px #153d3120; }
    header { padding:20px 22px 22px; color:#fff; background:linear-gradient(135deg,var(--deep),var(--green)); }
    .brand { display:flex; align-items:center; justify-content:space-between; } .brand h1 { font-size:20px; margin:0; letter-spacing:.04em; } .brand button { background:#ffffff20; color:white; padding:8px 11px; border-radius:9px; font-size:13px; }
    .today { margin:25px 0 0; font-size:14px; opacity:.9; } #clock { font-variant-numeric:tabular-nums; font-size:42px; font-weight:700; letter-spacing:.03em; margin-top:3px; }
    main { padding:20px 18px 40px; } .person { display:flex; align-items:center; justify-content:space-between; padding:13px 14px; background:#f1f6f3; border-radius:12px; margin-bottom:21px; }
    .person label { color:var(--muted); font-size:12px; display:block; } .person select { background:transparent; border:0; color:var(--ink); font-weight:700; font-size:17px; max-width:250px; text-align:right; }
    .lead { font-size:14px; color:var(--muted); margin:0 3px 12px; } .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .punch { min-height:112px; padding:14px; text-align:left; border:1px solid var(--line); border-radius:15px; background:#fff; transition:.15s; box-shadow:0 2px 7px #173c3310; }
    .punch:active { transform:scale(.97); } .punch .icon { font-size:27px; display:block; margin-bottom:7px; } .punch strong { display:block; font-size:17px; } .punch small { color:var(--muted); font-size:12px; }
    .punch.start { border-color:#90c8b9; background:#f4fbf8; } .punch.end { border-color:#f2c092; background:#fff9f1; } .punch.end strong { color:#a65014; }
    .notice { min-height:22px; text-align:center; color:var(--green); font-weight:700; font-size:13px; margin:15px 0 6px; }.install { width:100%; margin:8px 0 15px; padding:11px; border-radius:10px; background:#e7f4ef; color:var(--deep); font-weight:700; }
    .site-options { display:grid; gap:8px; margin:10px 0; }.site-option { display:flex; gap:10px; align-items:center; padding:11px; border:1px solid var(--line); border-radius:9px; color:var(--ink); }.site-option input { width:18px; height:18px; }
    h2 { font-size:16px; margin:28px 3px 10px; } .history { border:1px solid var(--line); border-radius:13px; overflow:hidden; } .row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:13px 14px; border-bottom:1px solid var(--line); font-size:14px; } .row:last-child { border:0; } .row .time { font-weight:700; font-variant-numeric:tabular-nums; } .tag { padding:4px 8px; font-size:11px; border-radius:99px; background:#e7f4ef; color:var(--green); } .tag.end { background:#fff0df; color:#a65014; }.empty { color:var(--muted); text-align:center; padding:24px; font-size:14px; }.report { width:100%; border-collapse:collapse; font-size:12px; margin:10px 0; }.report th,.report td { padding:8px 4px; border-bottom:1px solid var(--line); text-align:left; }.report th { color:var(--muted); font-weight:500; }.record-actions button { margin-left:6px; padding:4px 7px; font-size:11px; border-radius:6px; background:#edf1ef; }.record-actions .remove-record { color:#b43e33; }
    dialog { width:min(92vw,460px); border:0; border-radius:18px; padding:0; box-shadow:0 15px 50px #001b1370; } dialog::backdrop { background:#001b1366; } .modal { padding:22px; } .modal h2 { margin:0 0 16px; font-size:19px; }.field { display:block; margin:13px 0; font-size:13px; color:var(--muted); }.field input { width:100%; padding:11px; border:1px solid var(--line); border-radius:9px; margin-top:5px; color:var(--ink); }.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }.secondary,.primary { padding:10px 14px; border-radius:9px; }.secondary { background:#edf1ef; color:var(--ink); }.primary { background:var(--green); color:#fff; }.admin-list { margin:15px 0; padding:0; list-style:none; }.admin-list li { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }.delete { color:#b43e33; background:none; font-size:13px; }.export { width:100%; margin-top:8px; padding:13px; background:var(--deep); color:white; border-radius:10px; font-weight:700; }.hint { font-size:12px; color:var(--muted); line-height:1.6; }
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand"><h1>らくらく勤怠 <span id="companyName">会社名を設定</span></h1><button id="adminOpen" hidden>管理・集計</button></div><div class="today" id="today"></div><div id="clock">--:--</div></header>
    <main>
      <div class="person"><div><label>打刻する人</label><select id="employee"></select></div><span>⌄</span></div>
      <p class="lead">該当するボタンを1回押すだけで記録されます。</p>
      <div class="actions">
        <button class="punch start" data-type="出勤"><span class="icon">☀️</span><strong>出勤</strong><small>会社へ出勤</small></button>
        <button class="punch start" data-type="直行"><span class="icon">🚃</span><strong>直行</strong><small>現場へ直接向かう</small></button>
        <button class="punch end" data-type="退勤"><span class="icon">🌙</span><strong>退勤</strong><small>勤務終了</small></button>
        <button class="punch end" data-type="直帰"><span class="icon">🏠</span><strong>直帰</strong><small>現場から直接帰る</small></button>
      </div>
      <div class="notice" id="notice"></div>
      <button class="install" id="install" hidden>📲 このアプリをホーム画面に追加</button>
      <h2>今日の記録</h2><div class="history" id="history"></div>
    </main>
  </div>
  <dialog id="adminDialog"><div class="modal" id="adminContent"></div></dialog>
  <dialog id="siteDialog"><div class="modal" id="siteContent"></div></dialog>
  <script src="app-config.js"></script>
  <script>
    const KEY='rakuraku-kintai-v1';
    const SELECTED_EMPLOYEE_KEY='rakuraku-kintai-selected-employee';
    const initial={ employees:['山田 太郎'], sites:[], holidays:[], records:[], pin:'1234', companyName:'会社名を設定', admins:[], closingDay:20, overtimeStart:'18:00' };
    let data=JSON.parse(localStorage.getItem(KEY)||'null')||initial;
    data.sites ||= [];
    data.holidays ||= [];
    data.admins ||= [];
    data.closingDay ||= 20;
    data.overtimeStart ||= '18:00';
    const API=window.KINTAI_API_URL||'';
    let adminPin=data.pin;
    const $=s=>document.querySelector(s), esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'), jpDate=d=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(d), keyDate=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(d);
    function save(){localStorage.setItem(KEY,JSON.stringify(data));}
    function callShared(payload){return new Promise(resolve=>{if(!API)return resolve({ok:true});if(adminPin)payload.adminName=$('#employee').value;const callback='kintaiWrite_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');window[callback]=result=>{delete window[callback];script.remove();resolve(result);};script.src=`${API}?payload=${encodeURIComponent(JSON.stringify(payload))}&callback=${callback}`;script.onerror=()=>{delete window[callback];script.remove();resolve({ok:false,error:'通信を確認してください'});};document.head.appendChild(script);});}
    function postShared(payload){callShared(payload).then(result=>{if(!result.ok){$('#notice').textContent=`共有保存に失敗しました：${result.error||'設定を確認してください'}`;loadShared();}});}
    function verifyAdmin(pin){const callback='kintaiAdmin_'+Date.now(),script=document.createElement('script');window[callback]=result=>{delete window[callback];script.remove();if(result.ok){adminPin=pin;admin();}else alert('管理者名または暗証番号が違います');};script.src=`${API}?action=verifyAdmin&name=${encodeURIComponent($('#employee').value)}&pin=${encodeURIComponent(pin)}&callback=${callback}`;script.onerror=()=>alert('管理者確認に失敗しました');document.head.appendChild(script);}
    function loadShared(){if(!API)return;const callback='kintaiData_'+Date.now();window[callback]=payload=>{delete window[callback];script.remove();if(payload.ok){data={...data,...payload.data};save();render();$('#notice').textContent='共有データを読み込みました';setTimeout(()=>$('#notice').textContent='',2500);}};const script=document.createElement('script');script.src=`${API}?action=bootstrap&callback=${callback}`;script.onerror=()=>{$('#notice').textContent='共有データを読み込めません。通信を確認してください';};document.head.appendChild(script);}
    function render(){ const sel=$('#employee'), current=sel.value||localStorage.getItem(SELECTED_EMPLOYEE_KEY); sel.innerHTML=data.employees.map(n=>`<option>${n}</option>`).join(''); if(data.employees.includes(current))sel.value=current; localStorage.setItem(SELECTED_EMPLOYEE_KEY,sel.value); $('#companyName').textContent=data.companyName||'会社名を設定';$('#adminOpen').hidden=!data.admins.includes(sel.value);const who=sel.value, today=keyDate(new Date()); const rows=data.records.filter(r=>r.name===who&&r.date===today).sort((a,b)=>b.at-a.at); $('#history').innerHTML=rows.length?rows.map(r=>`<div class="row"><div><span class="tag ${['退勤','直帰'].includes(r.type)?'end':''}">${r.type}</span>${r.sites?.length?`<div class="hint">現場：${r.sites.join('、')}</div>`:''}</div><div class="time">${new Date(r.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):'<div class="empty">まだ打刻はありません</div>'; }
    function tick(){const d=new Date();$('#today').textContent=jpDate(d);$('#clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});} tick();setInterval(tick,1000);render();loadShared();
    $('#employee').addEventListener('change',()=>{localStorage.setItem(SELECTED_EMPLOYEE_KEY,$('#employee').value);render();});
    document.querySelectorAll('.punch').forEach(b=>b.addEventListener('click',()=>authorizePunch(b.dataset.type)));
    function authorizePunch(type){return recordPunch(type,[],['出勤','直行'].includes(type)?()=>chooseSites(type):null);}
    function chooseSites(type,selected=[]){const dialog=$('#siteDialog');dialog.showModal();$('#siteContent').innerHTML=`<h2>現場を選択</h2><p class="hint">現場は複数選択できます。打刻時刻はすでに記録されています。</p><div class="site-options">${data.sites.map(s=>`<label class="site-option"><input type="checkbox" value="${esc(s)}" ${selected.includes(s)?'checked':''}>${esc(s)}</label>`).join('')||'<p class="hint">登録済みの現場はありません。</p>'}</div><button class="secondary" id="siteQuickAdd">＋ 現場を追加</button><div class="modal-actions"><button class="secondary" onclick="siteDialog.close()">あとで選ぶ</button><button class="primary" id="siteConfirm">現場を保存</button></div>`;$('#siteQuickAdd').onclick=()=>{const name=prompt('追加する現場名を入力してください');if(!name?.trim())return;const n=name.trim();if(data.sites.includes(n))return alert('同じ現場名が登録されています');const checked=[...document.querySelectorAll('#siteContent input:checked')].map(x=>x.value);data.sites.push(n);save();postShared({action:'addSiteByStaff',name:n,staff:$('#employee').value});chooseSites(type,[...checked,n]);};$('#siteConfirm').onclick=()=>{const sites=[...document.querySelectorAll('#siteContent input:checked')].map(x=>x.value);dialog.close();saveSites(type,sites);};}
    function recordPunch(type,sites,after){const now=new Date(),name=$('#employee').value,date=keyDate(now),group=['出勤','直行'].includes(type)?['出勤','直行']:['退勤','直帰'];const existing=data.records.find(r=>r.name===name&&r.date===date&&group.includes(r.type));if(existing){$('#notice').textContent=`今日はすでに「${existing.type}」を記録済みです。「${type}」は記録できません`;return;}const record={name,type,date,at:now.getTime(),sites};data.records.push(record);save();postShared({action:'punch',...record});render();$('#notice').textContent=`${type}を ${now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})} に記録しました`;setTimeout(()=>$('#notice').textContent='',3500);if(after)after();}
    function saveSites(type,sites){const name=$('#employee').value,date=keyDate(new Date()),record=[...data.records].reverse().find(r=>r.name===name&&r.type===type&&r.date===date);if(!record)return;record.sites=sites;save();postShared({action:'updateRecordSites',name,date,type,sites});render();}
    $('#adminOpen').addEventListener('click',()=>{const dialog=$('#adminDialog'); dialog.showModal(); $('#adminContent').innerHTML=`<h2>管理・集計</h2><label class="field">管理者暗証番号<input id="pin" type="password" inputmode="numeric" placeholder="初期値: 1234"></label><p class="hint">初回の暗証番号は 1234 です。ログイン後に変更できます。</p><div class="modal-actions"><button class="secondary" onclick="adminDialog.close()">閉じる</button><button class="primary" id="login">開く</button></div>`;$('#login').onclick=()=>{if(API)verifyAdmin($('#pin').value);else if($('#pin').value===data.pin){adminPin=$('#pin').value;admin();}else alert('暗証番号が違います');};});
    function admin(){ $('#adminContent').innerHTML=`<h2>管理・集計</h2><label class="field">対象月<input id="month" type="month"></label><div id="report"></div><h2>打刻の修正・削除</h2><div id="adminRecords" class="history"></div><label class="field">メンバーを追加<input id="newName" placeholder="例：佐藤 花子"></label><button class="primary" id="add">追加する</button><ul class="admin-list">${data.employees.map((n,i)=>`<li>${n}${data.employees.length>1?`<button class="delete" data-i="${i}">削除</button>`:''}</li>`).join('')}</ul><label class="field">現場を追加<input id="newSite" placeholder="例：東京第一現場"></label><button class="primary" id="addSite">追加する</button><ul class="admin-list">${data.sites.map((n,i)=>`<li>${n}<button class="delete" data-site-i="${i}">削除</button></li>`).join('')||'<li>現場は未登録です</li>'}</ul><label class="field">休日を追加<input id="holidayDate" type="date"><input id="holidayName" placeholder="例：創立記念日"></label><button class="primary" id="addHoliday">追加する</button><ul class="admin-list">${data.holidays.sort((a,b)=>a.date.localeCompare(b.date)).map((h,i)=>`<li>${h.date} ${esc(h.name)}${h.source==='manual'?`<button class="delete" data-holiday-i="${i}">削除</button>`:' <span class="hint">（祝日）</span>'}</li>`).join('')||'<li>手動休日は未登録です</li>'}</ul><button class="export" id="export">Excel用CSVをダウンロード</button><label class="field">管理者暗証番号を変更<input id="newPin" type="password" inputmode="numeric" placeholder="4桁以上"></label><button class="secondary" id="changePin">暗証番号を変更</button><p class="hint">日曜日と国民の祝日は自動で休日扱いです。修正・削除の内容は「変更履歴」に記録されます。</p><div class="modal-actions"><button class="secondary" onclick="adminDialog.close()">閉じる</button></div>`;
      const month=$('#month');month.value=keyDate(new Date()).slice(0,7);month.onchange=renderReport;$('#add').onclick=()=>{const n=$('#newName').value.trim();if(!n)return;if(data.employees.includes(n))return alert('同じ名前が登録されています');data.employees.push(n);save();postShared({action:'addMember',name:n,pin:adminPin});render();admin();};document.querySelectorAll('.delete[data-i]').forEach(b=>b.onclick=()=>{const name=data.employees[+b.dataset.i];data.employees.splice(+b.dataset.i,1);save();postShared({action:'removeMember',name,pin:adminPin});render();admin();});$('#addSite').onclick=()=>{const n=$('#newSite').value.trim();if(!n)return;if(data.sites.includes(n))return alert('同じ現場名が登録されています');data.sites.push(n);save();postShared({action:'addSite',name:n,pin:adminPin});admin();};document.querySelectorAll('[data-site-i]').forEach(b=>b.onclick=()=>{const name=data.sites[+b.dataset.siteI];data.sites.splice(+b.dataset.siteI,1);save();postShared({action:'removeSite',name,pin:adminPin});admin();});$('#addHoliday').onclick=()=>{const date=$('#holidayDate').value,name=$('#holidayName').value.trim();if(!date||!name)return alert('休日と名称を入力してください');if(data.holidays.some(h=>h.date===date))return alert('同じ日付は登録済みです');data.holidays.push({date,name});save();postShared({action:'addHoliday',date,name,pin:adminPin});admin();};document.querySelectorAll('[data-holiday-i]').forEach(b=>b.onclick=()=>{const h=data.holidays[+b.dataset.holidayI];data.holidays.splice(+b.dataset.holidayI,1);save();postShared({action:'removeHoliday',date:h.date,pin:adminPin});admin();});$('#changePin').onclick=()=>{const p=$('#newPin').value;if(p.length<4)return alert('4文字以上で入力してください');postShared({action:'changePin',pin:adminPin,newPin:p});adminPin=p;data.pin=p;save();alert('変更しました');};$('#export').onclick=exportCsv;renderReport();
    }
    function renderReport(){const m=$('#month').value,records=data.records.filter(r=>r.date.startsWith(m));const rows=data.employees.map(name=>{const days=[...new Set(records.filter(r=>r.name===name&&['出勤','直行'].includes(r.type)).map(r=>r.date))];let minutes=0;days.forEach(day=>{const events=records.filter(r=>r.name===name&&r.date===day).sort((a,b)=>a.at-b.at),start=events.find(r=>['出勤','直行'].includes(r.type)),end=start&&events.find(r=>r.at>start.at&&['退勤','直帰'].includes(r.type));if(start&&end)minutes+=Math.round((end.at-start.at)/60000);});return `<tr><td>${name}</td><td>${days.length}日</td><td>${Math.floor(minutes/60)}時間${minutes%60}分</td></tr>`;}).join('');$('#report').innerHTML=`<table class="report"><thead><tr><th>氏名</th><th>出勤日数</th><th>勤務時間</th></tr></thead><tbody>${rows}</tbody></table>`;$('#adminRecords').innerHTML=records.length?[...records].sort((a,b)=>b.at-a.at).map(r=>`<div class="row"><div><b>${r.name}</b> <span class="tag ${['退勤','直帰'].includes(r.type)?'end':''}">${r.type}</span><div class="hint">${r.date}</div></div><div><div class="time">${new Date(r.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div>${r.id?`<div class="record-actions"><button data-edit="${r.id}">修正</button><button class="remove-record" data-remove="${r.id}">削除</button></div>`:''}</div></div>`).join(''):'<div class="empty">この月の記録はありません</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRecord(b.dataset.edit));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeRecord(b.dataset.remove));}
    function editRecord(id){const r=data.records.find(x=>x.id===id);if(!r)return;const when=prompt('日時を YYYY-MM-DD HH:MM で入力してください',`${r.date} ${new Date(r.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`);if(!when)return;const type=prompt('種別：出勤・直行・退勤・直帰',r.type);const at=new Date(when.replace(' ','T')).getTime();if(!at||!['出勤','直行','退勤','直帰'].includes(type))return alert('入力内容を確認してください');r.date=when.slice(0,10);r.type=type;r.at=at;save();postShared({action:'updateRecord',id,date:r.date,type:r.type,at:r.at,pin:adminPin});render();renderReport();}
    function removeRecord(id){if(!confirm('この打刻を削除します。履歴には残ります。'))return;data.records=data.records.filter(r=>r.id!==id);save();postShared({action:'deleteRecord',id,pin:adminPin});render();renderReport();}
    function holidayName(date){return data.holidays.find(h=>h.date===date)?.name||(new Date(`${date}T00:00:00+09:00`).getDay()===0?'日曜日':'');}
    function exportCsv(){const q=s=>'"'+String(s).replaceAll('"','""')+'"',download=(name,rows)=>{const u=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(row=>row.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);};const head=['氏名','日付','打刻種別','打刻時刻','現場名','休日'];const body=[...data.records].sort((a,b)=>a.date.localeCompare(b.date)||a.at-b.at).map(r=>[r.name,r.date,r.type,new Date(r.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),(r.sites||[]).join('、'),holidayName(r.date)]);const years=[...new Set(data.records.map(r=>r.date.slice(0,4)))];const sundays=years.flatMap(year=>{let d=new Date(`${year}-01-01T00:00:00+09:00`),days=[];while(d.getFullYear()===+year){if(d.getDay()===0)days.push([keyDate(d),'日曜日']);d.setDate(d.getDate()+1);}return days;});download(`勤怠記録_${keyDate(new Date())}.csv`,[head,...body]);download(`休日一覧_${keyDate(new Date())}.csv`,[['日付','休日名'],...data.holidays.map(h=>[h.date,h.name]),...sundays]);}
    function closingPeriod(month){const [year,monthNumber]=month.split('-').map(Number),day=Number(data.closingDay)||20,previousMonth=monthNumber===1?12:monthNumber-1,previousYear=monthNumber===1?year-1:year;return {start:`${previousYear}-${String(previousMonth).padStart(2,'0')}-${String(day+1).padStart(2,'0')}`,end:`${year}-${String(monthNumber).padStart(2,'0')}-${String(day).padStart(2,'0')}`};}
    function dailyAttendance(name,date){const events=data.records.filter(r=>r.name===name&&r.date===date).sort((a,b)=>a.at-b.at),start=events.find(r=>['出勤','直行'].includes(r.type)),end=start&&events.find(r=>r.at>start.at&&['退勤','直帰'].includes(r.type));if(!start)return null;const work=end?Math.max(0,Math.round((end.at-start.at)/60000)):0,threshold=new Date(`${date}T${data.overtimeStart||'18:00'}:00+09:00`).getTime(),overtime=end?Math.max(0,Math.round((end.at-threshold)/60000)):0;return {date,holiday:holidayName(date),work,overtime};}
    const minutesLabel=minutes=>`${Math.floor(minutes/60)}時間${minutes%60}分`;
    function periodSummary(month){const period=closingPeriod(month),dates=[...new Set(data.records.filter(r=>r.date>=period.start&&r.date<=period.end).map(r=>r.date))];return {period,rows:data.employees.map(name=>{const days=dates.map(date=>dailyAttendance(name,date)).filter(Boolean);const regular=days.filter(day=>!day.holiday).length,holiday=days.filter(day=>day.holiday).length;return {name,regular,holiday,work:days.reduce((total,day)=>total+day.work,0),overtime:days.reduce((total,day)=>total+day.overtime,0)};})};}
    function renderReport(){const month=$('#month').value,summary=periodSummary(month);$('#report').innerHTML=`<p class="hint">集計期間：${summary.period.start} 〜 ${summary.period.end}<br>残業開始：${data.overtimeStart||'18:00'}</p><table class="report"><thead><tr><th>氏名</th><th>通常</th><th>休日</th><th>勤務時間</th><th>残業</th></tr></thead><tbody>${summary.rows.map(row=>`<tr><td>${esc(row.name)}</td><td>${row.regular}日</td><td>${row.holiday}日</td><td>${minutesLabel(row.work)}</td><td>${minutesLabel(row.overtime)}</td></tr>`).join('')}</tbody></table>`;const records=data.records.filter(r=>r.date>=summary.period.start&&r.date<=summary.period.end);$('#adminRecords').innerHTML=records.length?[...records].sort((a,b)=>b.at-a.at).map(r=>`<div class="row"><div><b>${esc(r.name)}</b> <span class="tag ${['退勤','直帰'].includes(r.type)?'end':''}">${r.type}</span><div class="hint">${r.date}${holidayName(r.date)?`・${holidayName(r.date)}`:''}</div></div><div class="time">${new Date(r.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):'<div class="empty">この期間の記録はありません</div>';}
    function exportCsv(){const quote=value=>'"'+String(value).replaceAll('"','""')+'"',download=(name,rows)=>{const url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(row=>row.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=name;link.click();URL.revokeObjectURL(url);},month=keyDate(new Date()).slice(0,7),summary=periodSummary(month),raw=data.records.filter(r=>r.date>=summary.period.start&&r.date<=summary.period.end).sort((a,b)=>a.date.localeCompare(b.date)||a.at-b.at).map(r=>[r.name,r.date,r.type,new Date(r.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),(r.sites||[]).join('、'),holidayName(r.date),holidayName(r.date)?'休日出勤':'通常出勤']);download(`勤怠明細_${summary.period.start}_${summary.period.end}.csv`,[['氏名','日付','打刻種別','打刻時刻','現場名','休日','勤務区分'],...raw]);download(`勤怠集計_${summary.period.start}_${summary.period.end}.csv`,[['集計開始','集計終了','氏名','通常出勤日数','休日出勤日数','勤務時間','残業時間'],...summary.rows.map(row=>[summary.period.start,summary.period.end,row.name,row.regular,row.holiday,minutesLabel(row.work),minutesLabel(row.overtime)])]);}
    let installEvent;const install=$('#install');window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installEvent=event;install.hidden=false;});install.addEventListener('click',async()=>{if(!installEvent)return;installEvent.prompt();await installEvent.userChoice;install.hidden=true;installEvent=null;});window.addEventListener('appinstalled',()=>{install.hidden=true;});if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
  </script>
